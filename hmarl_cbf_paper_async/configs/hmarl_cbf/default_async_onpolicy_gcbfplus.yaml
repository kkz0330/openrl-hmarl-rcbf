seed: 42

env:
  n_agents: 4
  n_obstacles: 3
  world_size: 10.0
  dt: 0.03
  horizon: 200
  action_limit: 2.0
  velocity_limit: 2.0
  agent_radius: 0.05
  goal_threshold: 0.3
  goal_speed_threshold: 0.1
  lidar_beams: 32
  lidar_range: 3.0
  lidar_noise_std: 0.0
  neighbor_radius: 3.0
  max_neighbors: 4
  min_start_goal_separation: 1.0
  min_agent_separation: 0.8
  min_obstacle_clearance: 0.4
  terminate_on_collision: true
  reward_progress_weight: 0.5
  reward_time_penalty: 0.01
  reward_reach_bonus: 5.0
  reward_collision_penalty: 2.5
  reward_oob_penalty: 2.5
  initial_speed_toward_goal: 0.0

synchronization:
  mode: async
  t_sync_max: 10

safety:
  d_min_agent: 0.3
  d_safe_obs: 0.3
  boundary_cbf: false
  boundary_margin: 0.3

skills:
  names: ["turn_left", "turn_right", "accelerate", "decelerate", "cruise"]
  default_max_duration: 10
  params:
    goal_threshold: 0.3
    goal_speed_threshold: 0.1
    action_limit: 2.0
    turn_min_speed: 0.05
    turn_target_angle: 0.6
    turn_heading_tol: 0.1
    turn_keep_speed: false
    turn_vmag: 1.1
    turn_track_kp: 2.0
    target_speed: 1.4
    accelerate_mode: velocity_increment
    accelerate_delta_speed: 0.3
    accelerate_stop_eps: 0.05
    accelerate_heading_blend: 0.0
    decelerate_init_min_speed: 0.1
    decelerate_target_speed: 0.05
    decelerate_delta_speed: 0.3
    decelerate_mode: velocity_decrement
    decelerate_stop_eps: 0.05
    decelerate_kv: 1.5
    cruise_min_speed: 0.2
    ref_speed: 1.2
    slow_radius: 1.5
    goal_stop_min_speed: 0.0
    d_min_agent: 0.3
    d_safe_obs: 0.3
    cbf_mode: distributed_gcbfplus
    cbf_share_agent: 0.5
    cbf_share_obs: 1.0
    use_input_bounds: true
    w_accel: 0.05
    w_turn: 0.03
    w_speed_dev: 0.04
    w_heading_dev: 0.02
    w_progress: 0.02
    w_goal_dist_pen: 0.02

model:
  high_hidden_dim: 128
  low_hidden_dim: 128
  action_dim: 2

low_level_qp:
  h_diag_min: 0.01
  h_diag_max: 20.0
  h_offdiag_abs_max: 2.0
  f_abs_max: 8.0
  f_residual_reference_enabled: true
  f_ref_speed: 1.2
  f_ref_kp: 1.2
  f_ref_slow_radius: 1.5
  f_ref_goal_stop_min_speed: 0.0
  phi_log_std_min: -5.0
  phi_log_std_max: -1.5
  w_clf: 10.0
  w_cbf: 100.0
  cbf_slack_max: 1.0
  cbf_k0: 1.0
  cbf_k1: 1.0
  clf_k: 1.0
  hocbf_gamma_h: 1.0
  hocbf_gamma_hdot: 1.0

high_level_mappo:
  clip_ratio: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  minibatch_size: 64
  normalize_advantages: true

qp:
  backend: cvxpylayers
  use_stub_if_unavailable: true

train:
  rollout_steps: 200
  total_iterations: 1000
  eval_interval: 10
  high_entropy_coef_start: 0.05
  high_entropy_coef_end: 0.01
  high_entropy_decay_iters: 700
  goal_visibility_reward: 0.02
  goal_visibility_improvement_reward: 0.3
  goal_heading_alignment_penalty: 0.0
  team_success_bonus: 4.0
  gamma_high: 0.99
  lam_high: 0.95
  gamma_low: 0.99
  low_ext_reward_coef: 0.0
  low_reward_mix_eta: 0.35
  low_reward_mix_divide_by_n_agents: true
  low_safety_margin_coef: 0.0
  low_safety_margin_h_agent: 0.0
  low_safety_margin_h_obstacle: 0.0
  high_option_progress_coef: 0.5
  high_option_boundary_recovery_coef: 0.0
  high_option_boundary_threshold: 0.0
  low_reference_pretrain_iters: 250
  low_update_mode_pretrain: reference_regression
  low_update_mode_main: onpolicy_ppo
  low_update_mode: onpolicy_ppo
  low_update_epochs: 1
  low_max_samples_per_iter: 256
  low_target_step_scale: 0.05
  low_ppo_epochs: 2
  low_ppo_clip_ratio: 0.2
  low_ppo_value_coef: 0.5
  low_ppo_entropy_coef: 0.0
  low_ppo_entropy_coef_start: 0.0005
  low_ppo_entropy_coef_end: 0.0
  low_ppo_entropy_decay_iters: 100
  low_ppo_max_grad_norm: 0.5
  low_policy_action_std: 0.2
  low_normalize_advantages: true
  low_deterministic_slack_coef: 0.02
  low_deterministic_cbf_slack_coef: 0.05

buffer_postprocess:
  gamma_high: 0.99
  lam_high: 0.95
  gamma_low: 0.99
  low_ext_reward_coef: 0.0
  low_reward_mix_eta: 0.35
  low_reward_mix_divide_by_n_agents: true
  low_safety_margin_coef: 0.0
  low_safety_margin_h_agent: 0.0
  low_safety_margin_h_obstacle: 0.0

curriculum:
  enabled: false
  single_agent_no_obstacle_iters: 200
  single_agent_no_obstacle_prob_start: 0.85
  single_agent_no_obstacle_prob_end: 0.15
